# Beta-first release workflow for better-semantic-release itself.
#
# INERT until manually dispatched -- there is no `push` trigger, so nothing here ever
# auto-releases. Auth uses the shared CI GitHub App (same as the rest of the stack):
#   - variable `CI_APP_ID` + secret `CI_APP_KEY` mint a short-lived token at runtime
#     (no long-lived PAT). The App must be installed on this repository.
#   - PyPI publishing uses a Trusted Publisher (OIDC) scoped to this repo + this
#     workflow file -- no PyPI token needed.
name: cd

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select release, publisher candidate, or signed G1 registry publication
        type: choice
        required: true
        default: release
        options:
          - release
          - publisher-image
          - registry-g1
      release_type:
        description: Release type (beta-first -- pick stable only when ready to publish for real)
        type: choice
        required: true
        default: beta
        options:
          - beta
          - stable
      registry_tag:
        description: Existing beta release tag that will advertise the signed G1 pair
        type: string
        required: false
      candidate_run_id:
        description: Release-bound publisher candidate workflow run ID
        type: string
        required: false
      candidate_run_attempt:
        description: Exact candidate workflow run attempt
        type: string
        required: false
        default: "1"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: inputs.operation == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # The environment must be provisioned with reviewers and branch policy before dispatch.
    # Without that external settings gate, GitHub must not be used for publication.
    environment:
      name: ${{ inputs.release_type == 'beta' && 'beta-publish' || 'stable-publish' }}

    steps:
      - name: Mint a token from the CI GitHub App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Before the release step rather than before the publish step: if the
      # packaging metadata is wrong there is no version worth tagging either,
      # and a PyPI upload can only be yanked, never replaced. Uses the runner's
      # own python3 -- the script is stdlib-only, so nothing needs installing.
      - name: Verify README registry metadata
        run: python3 scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.

      - name: Run better-semantic-release (dogfooding our own action)
        id: release
        uses: ./
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          prerelease: ${{ inputs.release_type == 'beta' }}
          prerelease_token: beta
          build: "true"

      # `semantic-release version` tags and writes the release notes; it does not
      # attach anything. `upload_to_vcs_release = true` is read by
      # `semantic-release publish`, which is a separate command and a separate
      # action -- so without this step the setting was on, the notes linked to
      # "GitHub Release Assets", and every release from v1.2.3 through v1.3.0
      # pointed at an empty assets list.
      #
      # Upstream's publish-action, not this fork: the fork's reason to exist is
      # the version-decision guards, and it has nothing to add to an upload. The
      # venv the install step above builds is handed on by step output rather
      # than $GITHUB_ENV precisely so it cannot leak into this container.
      - name: Attach the built distributions to the GitHub release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@5a5718ce47b892ef699f2972dae122297771d641 # v10.6.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Publish to PyPI (trusted publishing, OIDC)
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1


  # Candidate-only bootstrap. This route is deliberately mutually exclusive
  # with the release job and can only be dispatched from the protected main
  # branch. The existing beta-publish environment retains its branch/reviewer
  # policy; no new environment policy is hidden in this workflow.
  publisher-image:
    name: Build candidate publisher image
    if: inputs.operation == 'publisher-image' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: beta-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up isolated BuildKit builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3


      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Build reproducible candidate image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-publisher:candidate-${{ github.sha }}
        run: |
          set -euo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          case "$RUNNER_UID" in ''|*[!0-9]*) echo "runner uid is not numeric"; exit 1;; esac
          case "$RUNNER_GID" in ''|*[!0-9]*) echo "runner gid is not numeric"; exit 1;; esac
          if [ "$RUNNER_UID" -lt 1 ] || [ "$RUNNER_UID" -gt 65534 ]; then
            echo "runner uid is outside the image range"
            exit 1
          fi
          if [ "$RUNNER_GID" -lt 1 ] || [ "$RUNNER_GID" -gt 65534 ]; then
            echo "runner gid is outside the image range"
            exit 1
          fi

          FIRST_IMAGE="${IMAGE}-repro-first"
          FIRST_ARCHIVE="$RUNNER_TEMP/publisher-image-first.tar"
          SECOND_ARCHIVE="$RUNNER_TEMP/publisher-image-second.tar"
          trap 'rm -f "$FIRST_ARCHIVE" "$SECOND_ARCHIVE"' EXIT

          build_candidate() {
            local output="$1"
            local name="$2"
            docker buildx build \
              --no-cache \
              --build-arg "PUBLISHER_UID=$RUNNER_UID" \
              --build-arg "PUBLISHER_GID=$RUNNER_GID" \
              --build-arg "SOURCE_DATE_EPOCH=0" \
              --file publish-action/Dockerfile \
              --output "type=docker,dest=$output,name=$name,rewrite-timestamp=true" \
              .
          }

          build_candidate "$FIRST_ARCHIVE" "$FIRST_IMAGE"
          build_candidate "$SECOND_ARCHIVE" "$IMAGE"
          docker load --input "$FIRST_ARCHIVE"
          docker load --input "$SECOND_ARCHIVE"

          FIRST_ID="$(docker image inspect "$FIRST_IMAGE" --format '{{.Id}}')"
          SECOND_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          FIRST_LAYERS="$(docker image inspect "$FIRST_IMAGE" --format '{{json .RootFS.Layers}}')"
          SECOND_LAYERS="$(docker image inspect "$IMAGE" --format '{{json .RootFS.Layers}}')"
          test "$FIRST_ID" = "$SECOND_ID"
          test "$FIRST_LAYERS" = "$SECOND_LAYERS"
          docker image rm "$FIRST_IMAGE"

      - name: Smoke-test candidate runtime mounts with output preflight
        env:
          IMAGE: ghcr.io/${{ github.repository }}-publisher:candidate-${{ github.sha }}
        run: |
          set -eu
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          mkdir -p "$SMOKE_DIR/workspace" "$SMOKE_DIR/hostile" "$SMOKE_DIR/marker"
          printf 'smoke input\n' > "$SMOKE_DIR/workspace/input"
          printf '%s\n' 'from pathlib import Path; Path("/marker/sitecustomize-ran").write_text("bad")' > "$SMOKE_DIR/hostile/sitecustomize.py"
          : > "$SMOKE_DIR/github-output"
          chmod 0644 "$SMOKE_DIR/github-output"
          docker run --rm \
            --mount "type=bind,src=$SMOKE_DIR/workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=$SMOKE_DIR/github-output,dst=/github-output" \
            --env GITHUB_OUTPUT=/github-output \
            --entrypoint /usr/local/bin/python \
            "$IMAGE" \
            -I -S -B -u \
            -c 'import sys; sys.path.insert(0,"/opt/publisher"); from pathlib import Path; from release_publisher import _open_output_channel, _read_regular_once, _write_outputs; channel=_open_output_channel(); assert channel is not None; assert _read_regular_once(Path("/workspace/input"), workspace=Path("/workspace"), limit=1024, scope="smoke") == b"smoke input\n"; _write_outputs({"transaction_id":"smoke","manifest_sha256":"0"*64,"release_id":1,"release_url":"https://example.test","created":False,"uploaded_count":0,"reused_count":0,"asset_set_sha256":"1"*64,"result_sha256":"2"*64}, channel); channel.close()'
          test "$(grep -Fc 'transaction_id=smoke' "$SMOKE_DIR/github-output")" -eq 1
          set +e
          docker run --rm \
            --mount "type=bind,src=$SMOKE_DIR/workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=$SMOKE_DIR/github-output,dst=/github-output" \
            --mount "type=bind,src=$SMOKE_DIR/hostile,dst=/hostile,readonly" \
            --mount "type=bind,src=$SMOKE_DIR/marker,dst=/marker" \
            --env GITHUB_OUTPUT=/github-output \
            --env PYTHONPATH=/hostile \
            "$IMAGE" > "$SMOKE_DIR/hostile.stdout" 2> "$SMOKE_DIR/hostile.stderr"
          status=$?
          set -e
          test "$status" -eq 1
          grep -Fqx 'publisher manifest input' "$SMOKE_DIR/hostile.stderr"
          test ! -e "$SMOKE_DIR/marker/sitecustomize-ran"

      - name: Push candidate image and resolve local digest
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-publisher:candidate-${{ github.sha }}
        run: |
          set -eu
          docker push "$IMAGE"
          REPOSITORY="${IMAGE%%:*}"
          REPO_DIGEST="$(docker image inspect "$IMAGE" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' |
            while IFS= read -r candidate; do
              case "$candidate" in
                "$REPOSITORY"@sha256:*) printf '%s\n' "$candidate"; break ;;
              esac
            done)"
          case "$REPO_DIGEST" in
            "$REPOSITORY"@sha256:*) ;;
            *) echo "local image inspect did not return the pushed repository digest"; exit 1 ;;
          esac
          SUBJECT_DIGEST="${REPO_DIGEST#"$REPOSITORY"@}"
          if [[ ! "$SUBJECT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "local image digest is not an exact sha256 digest"
            exit 1
          fi
          REMOTE_DIGEST="$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{ .Manifest.Digest }}')"
          if [[ ! "$REMOTE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "remote image readback is not an exact sha256 digest"
            exit 1
          fi
          if [ "$REMOTE_DIGEST" != "$SUBJECT_DIGEST" ]; then
            echo "remote image digest does not match the local subject digest"
            exit 1
          fi
          {
            printf 'subject_name=%s\n' "$REPOSITORY"
            printf 'subject_digest=%s\n' "$SUBJECT_DIGEST"
            printf 'repo_digest=%s\n' "$REPO_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Attest candidate image provenance
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.0
        with:
          subject-name: ${{ steps.image.outputs.subject_name }}
          subject-digest: ${{ steps.image.outputs.subject_digest }}
          push-to-registry: true

      - name: Verify provenance and write candidate handoff
        id: handoff
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          GH_TOKEN: ${{ github.token }}
          REPO_DIGEST: ${{ steps.image.outputs.repo_digest }}
          SUBJECT_DIGEST: ${{ steps.image.outputs.subject_digest }}
          SUBJECT_NAME: ${{ steps.image.outputs.subject_name }}
        run: |
          set -euo pipefail
          case "$ATTESTATION_ID" in
            ''|*[!0-9]*) echo "attestation id is not numeric"; exit 1 ;;
          esac
          case "$SUBJECT_DIGEST" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo "subject digest is not sha256"; exit 1 ;;
          esac
          test "$REPO_DIGEST" = "$SUBJECT_NAME@$SUBJECT_DIGEST"
          gh attestation verify "oci://$REPO_DIGEST" \
            --repo "$GITHUB_REPOSITORY"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          bundle_path = Path(os.environ["ATTESTATION_BUNDLE"])
          if not bundle_path.is_file() or bundle_path.stat().st_size > 16 * 1024 * 1024:
              raise SystemExit("attestation bundle is missing or oversized")
          bundle = json.loads(bundle_path.read_text(encoding="utf-8"))
          canonical_bundle = json.dumps(
              bundle,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          handoff = {
              "schema_version": "bsr-publisher-candidate/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "image_ref": os.environ["SUBJECT_NAME"],
              "image_digest": os.environ["SUBJECT_DIGEST"],
              "repo_digest": os.environ["REPO_DIGEST"],
              "provenance_attestation_id": os.environ["ATTESTATION_ID"],
              "provenance_attestation_url": os.environ["ATTESTATION_URL"],
              "provenance_digest": hashlib.sha256(canonical_bundle).hexdigest(),
              "dockerfile_sha256": sha256(Path("publish-action/Dockerfile")),
              "runtime_sha256": sha256(
                  Path("src/semantic_release/bsr/release_publisher.py")
              ),
          }
          encoded = (
              json.dumps(
                  handoff,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          Path("publisher-image-candidate.json").write_bytes(encoded)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"metadata_sha256={hashlib.sha256(encoded).hexdigest()}\n")
          PY

      - name: Upload candidate handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publisher-image-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: publisher-image-candidate.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  registry-g1:
    name: Publish and fresh-load signed G1 registry
    if: inputs.operation == 'registry-g1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: beta-publish
    permissions:
      actions: read
      attestations: read
      contents: write
      id-token: write
      packages: read

    steps:
      - name: Checkout release-bound source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download exact release-bound candidate handoff
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TAG: ${{ inputs.registry_tag }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_RUN_ID" in
            ''|*[!0-9]*) echo "candidate run id is not numeric"; exit 1 ;;
          esac
          case "$CANDIDATE_RUN_ATTEMPT" in
            ''|*[!0-9]*) echo "candidate run attempt is not numeric"; exit 1 ;;
          esac
          case "$REGISTRY_TAG" in
            v[0-9]*.[0-9]*.[0-9]*-*) ;;
            *) echo "registry tag is not a prerelease tag"; exit 1 ;;
          esac
          git fetch --force origin "refs/tags/$REGISTRY_TAG:refs/tags/$REGISTRY_TAG"
          test "$(git rev-list -n 1 "$REGISTRY_TAG")" = "$GITHUB_SHA"
          ARTIFACT_NAME="publisher-image-candidate-$GITHUB_SHA-$CANDIDATE_RUN_ID-$CANDIDATE_RUN_ATTEMPT"
          mkdir candidate
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir candidate
          test -s candidate/publisher-image-candidate.json

      - name: Download release assets and build canonical G1 record
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TAG: ${{ inputs.registry_tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$REGISTRY_TAG" > release.json
          mkdir release-assets
          while IFS=$'\t' read -r asset_id asset_name; do
            case "$asset_id" in
              ''|*[!0-9]*) echo "release asset id is not numeric"; exit 1 ;;
            esac
            case "$asset_name" in
              ''|*/*|*\\*|.|..) echo "unsafe release asset name"; exit 1 ;;
            esac
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "release-assets/$asset_name"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' release.json)

          REPO_DIGEST="$(jq -er '.repo_digest' candidate/publisher-image-candidate.json)"
          gh attestation verify "oci://$REPO_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/cd.yml@refs/heads/main" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners

          python3 - <<'PY'
          from __future__ import annotations

          import datetime
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          head = os.environ["GITHUB_SHA"]
          tag = os.environ["REGISTRY_TAG"]
          candidate_run_id = int(os.environ["CANDIDATE_RUN_ID"])
          candidate_run_attempt = int(os.environ["CANDIDATE_RUN_ATTEMPT"])

          def sha256_bytes(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()

          def git(*arguments: str) -> str:
              return subprocess.check_output(
                  ["git", *arguments],
                  encoding="utf-8",
              ).strip()

          def action(path: str) -> dict[str, str]:
              content = Path(path).read_bytes()
              return {
                  "repository": repository,
                  "path": path,
                  "sha": head,
                  "action_blob_oid": git("rev-parse", f"{head}:{path}"),
                  "action_sha256": sha256_bytes(content),
              }

          candidate_path = Path("candidate/publisher-image-candidate.json")
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))
          candidate_keys = {
              "schema_version",
              "repository",
              "source_commit",
              "workflow_run_id",
              "workflow_run_attempt",
              "image_ref",
              "image_digest",
              "repo_digest",
              "provenance_attestation_id",
              "provenance_attestation_url",
              "provenance_digest",
              "dockerfile_sha256",
              "runtime_sha256",
          }
          if set(candidate) != candidate_keys:
              raise SystemExit("candidate handoff shape mismatch")
          if candidate["schema_version"] != "bsr-publisher-candidate/v1":
              raise SystemExit("candidate handoff schema mismatch")
          if candidate["repository"] != repository or candidate["source_commit"] != head:
              raise SystemExit("candidate handoff source mismatch")
          if (
              candidate["workflow_run_id"] != candidate_run_id
              or candidate["workflow_run_attempt"] != candidate_run_attempt
          ):
              raise SystemExit("candidate workflow run mismatch")
          if (
              candidate["repo_digest"]
              != f"{candidate['image_ref']}@{candidate['image_digest']}"
          ):
              raise SystemExit("candidate image tuple mismatch")

          publisher_action = Path("publish-action/action.yml").read_text(
              encoding="utf-8"
          )
          expected_publisher_image = (
              f"image: docker://{candidate['image_ref']}@{candidate['image_digest']}"
          )
          image_lines = [
              line.strip()
              for line in publisher_action.splitlines()
              if line.strip().startswith("image:")
          ]
          if image_lines != [expected_publisher_image]:
              raise SystemExit("publisher action digest mismatch")

          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          if (
              release["tag_name"] != tag
              or release["draft"] is not False
              or release["prerelease"] is not True
              or release["html_url"]
              != f"https://github.com/{repository}/releases/tag/{tag}"
          ):
              raise SystemExit("beta release tuple mismatch")
          issued_at = datetime.datetime.strptime(
              release["published_at"], "%Y-%m-%dT%H:%M:%SZ"
          ).replace(tzinfo=datetime.timezone.utc)
          expires_at = issued_at + datetime.timedelta(days=30)

          workflow_path = ".github/workflows/cd.yml"
          workflow_bytes = Path(workflow_path).read_bytes()
          source = {
              "schema_version": "bsr-action-registry/v1",
              "generation": 1,
              "phase": "G1",
              "channel": "beta",
              "issued_at": issued_at.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "expires_at": expires_at.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "owner": "release-security",
              "previous": None,
              "head_oid": head,
              "head_hash": sha256_bytes(
                  subprocess.check_output(["git", "cat-file", "commit", head])
              ),
              "version_action": action("action.yml"),
              "publish_action": action("publish-action/action.yml"),
              "registry_action": action("registry-action/action.yml"),
              "publisher": {
                  "identity": (
                      f"https://github.com/{repository}/.github/workflows/"
                      "cd.yml@refs/heads/main"
                  ),
                  "image_ref": candidate["image_ref"],
                  "image_digest": candidate["image_digest"],
                  "image_source_commit": head,
                  "dockerfile_sha256": candidate["dockerfile_sha256"],
                  "runtime_sha256": candidate["runtime_sha256"],
                  "provenance_repository": repository,
                  "provenance_workflow": workflow_path,
                  "provenance_attestation_id": candidate[
                      "provenance_attestation_id"
                  ],
                  "provenance_digest": candidate["provenance_digest"],
              },
              "advertisement": {
                  "repository": repository,
                  "tag": tag,
                  "target_sha": head,
                  "release_url": release["html_url"],
                  "registry_asset": "bsr-action-registry.json",
                  "signature_asset": "bsr-action-registry.sigstore.json",
                  "image_ref": candidate["repo_digest"],
              },
              "workflow": {
                  "repository": repository,
                  "path": workflow_path,
                  "release_commit": head,
                  "blob_oid": git("rev-parse", f"{head}:{workflow_path}"),
                  "sha256": sha256_bytes(workflow_bytes),
                  "environment": "beta-publish",
              },
          }
          Path("g1-registry-source.json").write_text(
              json.dumps(
                  source,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          python3 -I -S scripts/action_pin_registry.py generate \
            --input g1-registry-source.json \
            --output generated-registry.json
          python3 -I -S scripts/action_pin_registry.py verify \
            --input generated-registry.json \
            --output /dev/null

      - name: Install cosign for registry signing
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.1

      - name: Select or create the exact signed G1 pair
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/cd.yml@refs/heads/main
        run: |
          set -euo pipefail
          RECORD="release-assets/bsr-action-registry.json"
          SIGNATURE="release-assets/bsr-action-registry.sigstore.json"
          if [ -e "$SIGNATURE" ] && [ ! -e "$RECORD" ]; then
            echo "release contains an orphan registry signature"
            exit 1
          fi
          if [ -e "$RECORD" ]; then
            cmp --silent generated-registry.json "$RECORD"
          else
            cp generated-registry.json "$RECORD"
          fi
          if [ ! -e "$SIGNATURE" ]; then
            cosign sign-blob \
              --yes \
              --bundle "$SIGNATURE" \
              "$RECORD"
          fi
          cosign verify-blob \
            --bundle "$SIGNATURE" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RECORD"

          cp "$RECORD" tampered-registry.json
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tampered-registry.json")
          original = b'"owner":"release-security"'
          replacement = b'"owner":"release-securitz"'
          content = path.read_bytes()
          if content.count(original) != 1 or len(original) != len(replacement):
              raise SystemExit("tamper target mismatch")
          path.write_bytes(content.replace(original, replacement, 1))
          PY
          set +e
          cosign verify-blob \
            --bundle "$SIGNATURE" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            tampered-registry.json \
            > tampered-verification.stdout \
            2> tampered-verification.stderr
          tampered_status=$?
          set -e
          test "$tampered_status" -ne 0
          test -s tampered-verification.stderr

      - name: Build exact create-once release manifest
        env:
          REGISTRY_TAG: ${{ inputs.registry_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          asset_directory = Path("release-assets")
          names = sorted(path.name for path in asset_directory.iterdir())
          registry_names = {
              "bsr-action-registry.json",
              "bsr-action-registry.sigstore.json",
          }
          distributions = [name for name in names if name not in registry_names]
          if (
              len(names) != 4
              or len(distributions) != 2
              or sum(name.endswith(".whl") for name in distributions) != 1
              or sum(name.endswith(".tar.gz") for name in distributions) != 1
              or not registry_names.issubset(names)
          ):
              raise SystemExit("release asset set is not the exact G1 set")

          existing_content_types = {
              asset["name"]: asset["content_type"] for asset in release["assets"]
          }
          body = release["body"] or ""
          body_path = Path("g1-release-body.txt")
          body_path.write_text(body, encoding="utf-8")

          assets = []
          for name in names:
              path = asset_directory / name
              content = path.read_bytes()
              assets.append(
                  {
                      "name": name,
                      "path": path.as_posix(),
                      "size": len(content),
                      "sha256": hashlib.sha256(content).hexdigest(),
                      "content_type": existing_content_types.get(
                          name, "application/json"
                      ),
                  }
              )

          manifest = {
              "schema_version": "bsr-release-manifest/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "transaction_id": (
                  f"bsr-g1-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}"
              ),
              "tag": os.environ["REGISTRY_TAG"],
              "target_sha": os.environ["GITHUB_SHA"],
              "release": {
                  "name": release["name"],
                  "body_path": body_path.as_posix(),
                  "body_sha256": hashlib.sha256(
                      body_path.read_bytes()
                  ).hexdigest(),
                  "draft": False,
                  "prerelease": True,
                  "make_latest": False,
              },
              "assets": assets,
          }
          Path("g1-release-manifest.json").write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish create-once signed G1 asset pair
        id: publish
        uses: ./publish-action
        with:
          manifest: g1-release-manifest.json
          token: ${{ github.token }}

      - name: Fresh-load published signed G1 registry
        id: load
        uses: ./registry-action
        with:
          expected: generated-registry.json
          repository: ${{ github.repository }}
          token: ${{ github.token }}

      - name: Capture and verify G1 publication handoff
        env:
          ASSET_SET_SHA256: ${{ steps.publish.outputs.asset_set_sha256 }}
          CREATED: ${{ steps.publish.outputs.created }}
          LOADED_REGISTRY: ${{ steps.load.outputs.registry }}
          MANIFEST_SHA256: ${{ steps.publish.outputs.manifest_sha256 }}
          RELEASE_ID: ${{ steps.publish.outputs.release_id }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          RESULT_SHA256: ${{ steps.publish.outputs.result_sha256 }}
          REUSED_COUNT: ${{ steps.publish.outputs.reused_count }}
          TRANSACTION_ID: ${{ steps.publish.outputs.transaction_id }}
          UPLOADED_COUNT: ${{ steps.publish.outputs.uploaded_count }}
        run: |
          set -euo pipefail
          case "$CREATED" in False|false) ;; *) exit 1 ;; esac
          case "$UPLOADED_COUNT" in ''|*[!0-9]*) exit 1 ;; esac
          case "$REUSED_COUNT" in ''|*[!0-9]*) exit 1 ;; esac
          test "$((UPLOADED_COUNT + REUSED_COUNT))" -eq 4
          printf '%s\n' "$LOADED_REGISTRY" > g1-loader-result.json
          jq -e \
            '.generation == 1 and .phase == "G1" and .channel == "beta"' \
            g1-loader-result.json
          RECORD_SHA256="$(sha256sum generated-registry.json | cut -d' ' -f1)"
          SIGNATURE_SHA256="$(
            sha256sum release-assets/bsr-action-registry.sigstore.json |
              cut -d' ' -f1
          )"
          jq -n \
            --arg asset_set_sha256 "$ASSET_SET_SHA256" \
            --arg created "$CREATED" \
            --arg manifest_sha256 "$MANIFEST_SHA256" \
            --arg record_sha256 "$RECORD_SHA256" \
            --arg release_id "$RELEASE_ID" \
            --arg release_url "$RELEASE_URL" \
            --arg result_sha256 "$RESULT_SHA256" \
            --arg signature_sha256 "$SIGNATURE_SHA256" \
            --arg transaction_id "$TRANSACTION_ID" \
            --argjson reused_count "$REUSED_COUNT" \
            --argjson uploaded_count "$UPLOADED_COUNT" \
            '{
              schema_version: "bsr-g1-publication-handoff/v1",
              transaction_id: $transaction_id,
              release_id: $release_id,
              release_url: $release_url,
              created: (($created | ascii_downcase) == "true"),
              uploaded_count: $uploaded_count,
              reused_count: $reused_count,
              manifest_sha256: $manifest_sha256,
              asset_set_sha256: $asset_set_sha256,
              result_sha256: $result_sha256,
              record_sha256: $record_sha256,
              signature_sha256: $signature_sha256
            }' > g1-publication-handoff.json

      - name: Upload signed G1 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-g1-registry-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/publisher-image-candidate.json
            generated-registry.json
            release-assets/bsr-action-registry.json
            release-assets/bsr-action-registry.sigstore.json
            g1-release-manifest.json
            g1-loader-result.json
            g1-publication-handoff.json
            tampered-verification.stderr
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
# No downstream notification is dispatched from here, and that is a decision
# rather than an omission -- worth writing down, because a shared library cutting
# a stable release is exactly the case where you would expect one.
#
# Consumers pin this action by commit SHA with the version in a trailing comment,
# the form the README recommends. Renovate reads that comment, and the bump PR it
# opens is the propagation path; it has been carrying releases across consumers
# already. A dispatch-based notifier would sit alongside that, not replace it,
# and there is no handler listening for such a dispatch today -- an unhandled
# `repository_dispatch` fails by doing nothing, silently, on the one run a year
# where it mattered.
#
# Revisit when a handler exists. Until then the pins are covered, and this
# workflow is not pretending otherwise.
