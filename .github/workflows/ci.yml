name: ci

# These two cover disjoint ground: pull_request tests code before it lands,
# push-on-main tests it after, including anything that arrives by a direct commit
# or an admin merge. A branch pattern here would cover neither -- it repeats what
# pull_request already does, and since the two events carry different refs the
# concurrency group below cannot collapse them, so both run to completion. That
# was `feat/**`, and at ninety seconds a run nobody noticed; the Windows job made
# it twenty-four minutes of runner time and two of every check on the PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs (the two-file standard, spec 2026-10-30): every checkout+test job
  # runs on dispatch as well. `sha` is read by the main-integrity job only.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit for the main-integrity job to verify (default: the tip of the dispatched ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package publishes this repository's README to PyPI. Keep the registry
  # metadata check in CI as well as pre-commit and CD.
  readme-sync:
    name: Verify README registry metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.
      - name: Project SOT
        run: python -I scripts/repo-bootstrap/sot_check.py --repo . --mode gate

  lint-type-test:
    name: lint + type + test (linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    permissions:
      contents: read
      # The Codecov upload authenticates with this job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Create venv (Python ${{ matrix.python-version }})
        run: uv venv --python ${{ matrix.python-version }}

      - name: Verify Python LTS row
        run: uv run --no-sync python -c "import sys; assert f'{sys.version_info.major}.{sys.version_info.minor}' == '${{ matrix.python-version }}', sys.version"

      - name: Install project + test + mypy + dev (ruff) deps
        run: uv pip install -e ".[test,mypy,dev]"

      - name: Verify upstream ownership manifest
        run: uv run --no-sync python scripts/check_upstream_ownership.py --check

      # The manifest is the source of truth for every Python file this fork owns.
      # The checker validates it before each executable gate and derives the scope
      # passed to that gate, so CI cannot silently drift from the ownership list.
      - name: Ruff (repo config, select=ALL) on owned Python files
        if: matrix.python-version == '3.15'
        run: uv run --no-sync python scripts/check_upstream_ownership.py --run-gate python-lint

      - name: Ruff format check on owned Python files
        if: matrix.python-version == '3.15'
        run: uv run --no-sync python scripts/check_upstream_ownership.py --run-gate python-format

      - name: Mypy on owned source files
        if: matrix.python-version == '3.15'
        run: uv run --no-sync python scripts/check_upstream_ownership.py --run-gate python-type

      - name: Pytest (manifest-scoped tests on Linux)
        run: uv run --no-sync python scripts/check_upstream_ownership.py --run-gate python-test

      # Codecov refuses a tokenless upload for the default branch, and no upload token
      # is stored, so the upload authenticates with OIDC and fails the job when Codecov
      # refuses it. Pull requests skip it: a fork or Dependabot run cannot always mint
      # an OIDC token, and the required check must not depend on Codecov being reachable.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: github.event_name != 'pull_request' && matrix.python-version == '3.15'
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true

  # Lint, types and manifest-scoped test coverage stay in the Linux job.
  # Windows retains the full default suite so platform-specific behavior is
  # still exercised independently.
  #
  # Windows runs the full suite because platform-specific expectations are
  # intentionally exercised there; this caught twenty-one Linux-only
  # assumptions in the test suite.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    # The Linux job runs manifest-scoped tests. Windows is far
    # slower here because the full suite spawns git constantly and process
    # creation is expensive on it, so this is a stop-a-hang bound.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Create venv (Python 3.15)
        run: uv venv --python 3.15

      # [test] only -- the same set tox declares for its test environment.
      - name: Install project + test deps
        run: uv pip install -e ".[test]"

      - name: Pytest (full default suite on Windows)
        run: uv run --no-sync pytest -q

  # The default selection is unit-only (tests/conftest.py), so neither job above
  # runs tests/e2e. The upstream workflow that did run them targeted `master`,
  # which this fork does not use, so before this job no CI run here had ever
  # executed them. That is how the tag-race guard's `git ls-remote` broke the
  # end-to-end `version` runs without anyone seeing it.
  #
  # Same split as the upstream workflow: every variation (`--comprehensive`) on
  # Linux, the default end-to-end selection on Windows, `COLUMNS` fixed on both
  # so rich-formatted output wraps the same way the expectations do.
  test-e2e:
    name: test e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pytest-args: --comprehensive
          - os: windows-latest
            pytest-args: ""
    env:
      COLUMNS: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Create venv (Python 3.15)
        run: uv venv --python 3.15

      - name: Install project + test deps
        run: uv pip install -e ".[test]"

      - name: Pytest (end-to-end suite)
        run: uv run --no-sync pytest -q -nauto -m e2e ${{ matrix.pytest-args }}

  action-smoke-test:
    name: composite action installs + runs forked source (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the real branch (semantic-release can't match release groups on detached HEAD)
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$HEAD_REF" in
            *[!A-Za-z0-9._/-]*) echo "invalid ref: $HEAD_REF"; exit 1 ;;
          esac
          git checkout -B "$HEAD_REF"

      - name: Run better-semantic-release action against this repo (read-only, no side effects)
        id: bsr
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: "true"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"
          build: "false"

      - name: Assert action produced outputs (proves composite output wiring + forked source ran)
        env:
          BSR_RELEASED: ${{ steps.bsr.outputs.released }}
          BSR_VERSION: ${{ steps.bsr.outputs.version }}
        run: |
          echo "released=$BSR_RELEASED"
          echo "version=$BSR_VERSION"
          test -n "$BSR_VERSION"
          test -n "$BSR_RELEASED"

      - name: Build-path smoke (force a version + run build_command; no git persistence)
        # Exercises the action's venv + build_command (python -m pip / python -m build).
        # `force: patch` makes a non-noop version so build actually runs; commit/tag/push
        # are off so nothing is released. Catches the pip-missing/venv-shadow class of
        # regression that a `build: false` smoke cannot.
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: "patch"
          build: "true"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"

  # Proves the action installs the uv its release directory asks for. A consumer
  # (KnowledgePrism) pins `required-version = ">=0.11.32,<0.13"` in a sub-project;
  # before this job the action installed the newest uv regardless, and that
  # project's build command died with "Required uv version ... does not match".
  # Each case builds its fixture under fx/ at run time (untracked, so the
  # ownership manifest has nothing to account for), runs the real action against
  # it, then reads the uv that ended up on PATH.
  action-uv-version-selection:
    name: composite action installs the uv required by its directory (${{ matrix.case }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        case:
          # [tool.uv] required-version in the directory's pyproject.toml
          - project-range
          # required-version in the directory's uv.toml
          - uv-toml-range
          # directory "." (the default): range in the workspace-root uv.toml
          - root-uv-toml-range
          # pyproject.toml with no [tool.uv]: nothing to honour, latest as before
          - no-uv-table
          # no pyproject.toml / uv.toml at all (KnowledgePrism's apps/web)
          - config-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the real branch (semantic-release can't match release groups on detached HEAD)
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$HEAD_REF" in
            *[!A-Za-z0-9._/-]*) echo "invalid ref: $HEAD_REF"; exit 1 ;;
          esac
          git checkout -B "$HEAD_REF"

      - name: Write the fixture for this case
        id: fixture
        shell: bash
        env:
          CASE: ${{ matrix.case }}
        run: |
          dir="fx/$CASE"
          mkdir -p "$dir"
          # registry = "none": on a release branch (main) the no-op run computes
          # a version, and the registry-collision guard would otherwise probe
          # PyPI for the repo's own name at that version and abort the run.
          # Branches that are not release branches never reach the guard, which
          # is how this passed on the PR and failed after the merge.
          printf '[semantic_release]\ntag_format = "fx-{version}"\n\n[semantic_release.bsr]\nschema_version = 1\nregistry = "none"\n' >"$dir/semantic-release.toml"
          range='required-version = ">=0.11.32,<0.13"'
          release_dir="$dir"
          expect=range
          case "$CASE" in
            project-range)
              printf '[project]\nname = "fx"\nversion = "0.0.0"\n\n[tool.uv]\n%s\n' "$range" >"$dir/pyproject.toml" ;;
            uv-toml-range)
              printf '%s\n' "$range" >"$dir/uv.toml" ;;
            root-uv-toml-range)
              printf '%s\n' "$range" >uv.toml
              release_dir=. ;;
            no-uv-table)
              printf '[project]\nname = "fx"\nversion = "0.0.0"\n' >"$dir/pyproject.toml"
              expect=latest ;;
            config-only)
              expect=latest ;;
            *) echo "unknown case: $CASE"; exit 1 ;;
          esac
          printf 'directory=%s\nexpect=%s\n' "$release_dir" "$expect" >>"$GITHUB_OUTPUT"

      - name: Run better-semantic-release against the fixture (no side effects)
        uses: ./
        with:
          directory: ${{ steps.fixture.outputs.directory }}
          # The action checks config_file before it cd's into `directory` and
          # semantic-release reads it after, so only an absolute path works.
          config_file: ${{ github.workspace }}/fx/${{ matrix.case }}/semantic-release.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: "true"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"
          build: "false"

      - name: Assert the installed uv honours (or ignores) the range
        shell: bash
        env:
          EXPECT: ${{ steps.fixture.outputs.expect }}
        run: |
          installed="$(uv --version | awk '{print $2}')"
          echo "installed uv: $installed (expect: $EXPECT)"
          # sort -V puts the smaller of two versions first.
          at_least() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; }
          case "$EXPECT" in
            range)
              # >=0.11.32,<0.13: the case this action used to get wrong.
              at_least 0.11.32 "$installed"
              at_least "$installed" 0.13.0 && [ "$installed" != 0.13.0 ] ;;
            latest)
              # 0.13.0 is the first release outside the range the other cases
              # pin, so "latest" means at least that; it only ever goes up.
              at_least 0.13.0 "$installed" ;;
          esac

  # The one job this repo forfeited by keeping its own ci.yml out of the shared
  # template's reach (see .repo-bootstrap.toml). Ported by hand rather than by
  # taking the template wholesale, which would have dropped the three jobs above.
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
        # Advisory, not a gate: the action fails the step on any pre-existing
        # moderate advisory in a dependency the PR merely touches, which blocks
        # unrelated work on a finding the PR did not introduce. The PR comment is
        # the deliverable here.
        continue-on-error: true

  codeql:
    name: CodeQL analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:python"

  # ============================================================================
  # main-integrity: detective control for the default branch (scripts/main_integrity.py).
  # Rendered into ci.yml from templates/fragments/main-integrity-job.yml. It used to
  # be a third workflow file (main-integrity.yml); the two-file standard (ci.yml +
  # cd.yml, spec 2026-10-30) keeps it here. It runs only on main:
  # dispatch CI on main after a merge; `sha` audits one specific commit
  # instead of the tip. On any other ref the job is skipped.
  # ============================================================================
  main-integrity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/main_integrity.py
          sparse-checkout-cone-mode: false
      - name: Verify the commit on the branch came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: python3 scripts/main_integrity.py --repo "$REPO" --sha "$SHA" --branch "$BRANCH"
