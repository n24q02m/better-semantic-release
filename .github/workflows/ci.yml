name: ci

# These two cover disjoint ground: pull_request tests code before it lands,
# push-on-main tests it after, including anything that arrives by a direct commit
# or an admin merge. A branch pattern here would cover neither -- it repeats what
# pull_request already does, and since the two events carry different refs the
# concurrency group below cannot collapse them, so both run to completion. That
# was `feat/**`, and at ninety seconds a run nobody noticed; the Windows job made
# it twenty-four minutes of runner time and two of every check on the PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly CodeQL scan, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint + type + test (linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Create venv (Python 3.13)
        run: uv venv --python 3.13

      - name: Install project + test + mypy + dev (ruff) deps
        run: uv pip install -e ".[test,mypy,dev]"

      # The path list is this fork's additions plus every stock file it patches.
      # tests/unit/semantic_release/bsr/test_gate_coverage.py holds it to that:
      # a file carrying a `# BSR-PATCH:` marker but missing here fails the suite,
      # which is how the omissions this list already had were found.
      - name: Ruff (repo config, select=ALL) on bsr additions
        run: >-
          uv run --no-sync ruff check --config pyproject.toml
          src/semantic_release/bsr
          src/semantic_release/changelog/release_history.py
          src/semantic_release/cli/cli_context.py
          src/semantic_release/cli/commands/publish.py
          src/semantic_release/cli/commands/version.py
          src/semantic_release/cli/github_actions_output.py
          src/semantic_release/version/algorithm.py
          tests/unit/semantic_release/bsr

      # Separate from `ruff check`: linting and formatting are different gates and
      # passing one says nothing about the other. pre-commit runs ruff-format as a
      # fixer, so a commit that lands without the hooks -- a web edit, a bot, a
      # `git commit` from an environment that never installed them -- is exactly
      # the case CI has to catch, and the case it was not catching.
      - name: Ruff format check on bsr additions
        run: >-
          uv run --no-sync ruff format --check --config pyproject.toml
          src/semantic_release/bsr
          src/semantic_release/changelog/release_history.py
          src/semantic_release/cli/cli_context.py
          src/semantic_release/cli/commands/publish.py
          src/semantic_release/cli/commands/version.py
          src/semantic_release/cli/github_actions_output.py
          src/semantic_release/version/algorithm.py
          tests/unit/semantic_release/bsr

      # Targets live in [tool.mypy] files in pyproject.toml so this job and the
      # pre-commit hook check the same set without either drifting.
      - name: Mypy on bsr additions + patched version command
        run: uv run --no-sync mypy

      # Coverage is measured on semantic_release.bsr only. The rest of the tree is
      # stock python-semantic-release, kept close to upstream on purpose, so its
      # number would report on upstream's testing rather than on this fork's.
      - name: Pytest (full default suite on Linux)
        run: uv run --no-sync pytest -q --cov=semantic_release.bsr --cov-report=xml

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Tests only. Lint, types and coverage are platform-independent and stay in the
  # Linux job -- running them twice would double the noise without doubling the
  # information.
  #
  # This exists because a suite that only ever runs on one platform stops being
  # able to disagree with that platform. Twenty-one tests here had written Linux
  # details into their own expectations -- os.linesep through text-mode files, an
  # absolute path assumed to contain no colon, an emptied environment assumed to
  # still find git on PATH -- and every one of them was wrong about the code while
  # passing on every release for thirteen releases. Windows found all twenty-one
  # the first time it ran them.
  test-windows:
    name: test (windows)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    # The Linux job runs this suite in about ninety seconds. Windows is far
    # slower here because the tests spawn git constantly and process creation is
    # expensive on it, so this is a stop-a-hang bound, not an expectation.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Create venv (Python 3.13)
        run: uv venv --python 3.13

      # [test] only -- the same set tox declares for its test environment.
      - name: Install project + test deps
        run: uv pip install -e ".[test]"

      - name: Pytest (full default suite on Windows)
        run: uv run --no-sync pytest -q

  action-smoke-test:
    name: composite action installs + runs forked source (linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the real branch (semantic-release can't match release groups on detached HEAD)
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$HEAD_REF" in
            *[!A-Za-z0-9._/-]*) echo "invalid ref: $HEAD_REF"; exit 1 ;;
          esac
          git checkout -B "$HEAD_REF"

      - name: Run better-semantic-release action against this repo (read-only, no side effects)
        id: bsr
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: "true"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"
          build: "false"

      - name: Assert action produced outputs (proves composite output wiring + forked source ran)
        env:
          BSR_RELEASED: ${{ steps.bsr.outputs.released }}
          BSR_VERSION: ${{ steps.bsr.outputs.version }}
        run: |
          echo "released=$BSR_RELEASED"
          echo "version=$BSR_VERSION"
          test -n "$BSR_VERSION"
          test -n "$BSR_RELEASED"

      - name: Build-path smoke (force a version + run build_command; no git persistence)
        # Exercises the action's venv + build_command (python -m pip / python -m build).
        # `force: patch` makes a non-noop version so build actually runs; commit/tag/push
        # are off so nothing is released. Catches the pip-missing/venv-shadow class of
        # regression that a `build: false` smoke cannot.
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: "patch"
          build: "true"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"

  # The one job this repo forfeited by keeping its own ci.yml out of the shared
  # template's reach (see .repo-bootstrap.toml). Ported by hand rather than by
  # taking the template wholesale, which would have dropped the three jobs above.
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
        # Advisory, not a gate: the action fails the step on any pre-existing
        # moderate advisory in a dependency the PR merely touches, which blocks
        # unrelated work on a finding the PR did not introduce. The PR comment is
        # the deliverable here.
        continue-on-error: true

  codeql:
    name: CodeQL analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:python"
