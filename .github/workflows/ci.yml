name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly CodeQL scan, Monday 03:17 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint + type + test (linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Create venv (Python 3.13)
        run: uv venv --python 3.13

      - name: Install project + test + mypy + dev (ruff) deps
        run: uv pip install -e ".[test,mypy,dev]"

      - name: Ruff (repo config, select=ALL) on bsr additions
        run: uv run --no-sync ruff check --config pyproject.toml src/semantic_release/bsr src/semantic_release/cli/commands/version.py src/semantic_release/cli/cli_context.py src/semantic_release/version/algorithm.py tests/unit/semantic_release/bsr

      - name: Mypy on bsr additions + patched version command
        run: uv run --no-sync mypy src/semantic_release/bsr src/semantic_release/cli/commands/version.py src/semantic_release/cli/cli_context.py src/semantic_release/version/algorithm.py

      # Coverage is measured on semantic_release.bsr only. The rest of the tree is
      # stock python-semantic-release, kept close to upstream on purpose, so its
      # number would report on upstream's testing rather than on this fork's.
      - name: Pytest (full default suite on Linux)
        run: uv run --no-sync pytest -q --cov=semantic_release.bsr --cov-report=xml

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  action-smoke-test:
    name: composite action installs + runs forked source (linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the real branch (semantic-release can't match release groups on detached HEAD)
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$HEAD_REF" in
            *[!A-Za-z0-9._/-]*) echo "invalid ref: $HEAD_REF"; exit 1 ;;
          esac
          git checkout -B "$HEAD_REF"

      - name: Run better-semantic-release action against this repo (read-only, no side effects)
        id: bsr
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: "true"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"
          build: "false"

      - name: Assert action produced outputs (proves composite output wiring + forked source ran)
        env:
          BSR_RELEASED: ${{ steps.bsr.outputs.released }}
          BSR_VERSION: ${{ steps.bsr.outputs.version }}
        run: |
          echo "released=$BSR_RELEASED"
          echo "version=$BSR_VERSION"
          test -n "$BSR_VERSION"
          test -n "$BSR_RELEASED"

      - name: Build-path smoke (force a version + run build_command; no git persistence)
        # Exercises the action's venv + build_command (python -m pip / python -m build).
        # `force: patch` makes a non-noop version so build actually runs; commit/tag/push
        # are off so nothing is released. Catches the pip-missing/venv-shadow class of
        # regression that a `build: false` smoke cannot.
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: "patch"
          build: "true"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"

  codeql:
    name: CodeQL analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:python"
