name: ci

# These two cover disjoint ground: pull_request tests code before it lands,
# push-on-main tests it after, including anything that arrives by a direct commit
# or an admin merge. A branch pattern here would cover neither -- it repeats what
# pull_request already does, and since the two events carry different refs the
# concurrency group below cannot collapse them, so both run to completion. That
# was `feat/**`, and at ninety seconds a run nobody noticed; the Windows job made
# it twenty-four minutes of runner time and two of every check on the PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly CodeQL scan, Monday 03:17 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package publishes this repository's README to PyPI. Keep the registry
  # metadata check in CI as well as pre-commit and CD.
  readme-sync:
    name: Verify README registry metadata
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.

  lint-type-test:
    name: lint + type + test (linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Create venv (Python 3.13)
        run: uv venv --python 3.13

      - name: Install project + test + mypy + dev (ruff) deps
        run: uv pip install -e ".[test,mypy,dev]"

      - name: Verify upstream ownership manifest
        run: uv run --no-sync python scripts/check_upstream_ownership.py --check

      # The manifest is the source of truth for every Python file this fork owns.
      # The checker validates it before each executable gate and derives the scope
      # passed to that gate, so CI cannot silently drift from the ownership list.
      - name: Ruff (repo config, select=ALL) on owned Python files
        run: uv run --no-sync python scripts/check_upstream_ownership.py --run-gate python-lint

      - name: Ruff format check on owned Python files
        run: uv run --no-sync python scripts/check_upstream_ownership.py --run-gate python-format

      - name: Mypy on owned source files
        run: uv run --no-sync python scripts/check_upstream_ownership.py --run-gate python-type

      - name: Pytest (manifest-scoped tests on Linux)
        run: uv run --no-sync python scripts/check_upstream_ownership.py --run-gate python-test

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Lint, types and manifest-scoped test coverage stay in the Linux job.
  # Windows retains the full default suite so platform-specific behavior is
  # still exercised independently.
  #
  # Windows runs the full suite because platform-specific expectations are
  # intentionally exercised there; this caught twenty-one Linux-only
  # assumptions in the test suite.
  test-windows:
    name: test (windows)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    # The Linux job runs manifest-scoped tests. Windows is far
    # slower here because the full suite spawns git constantly and process
    # creation is expensive on it, so this is a stop-a-hang bound.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Create venv (Python 3.13)
        run: uv venv --python 3.13

      # [test] only -- the same set tox declares for its test environment.
      - name: Install project + test deps
        run: uv pip install -e ".[test]"

      - name: Pytest (full default suite on Windows)
        run: uv run --no-sync pytest -q

  action-smoke-test:
    name: composite action installs + runs forked source (linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the real branch (semantic-release can't match release groups on detached HEAD)
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$HEAD_REF" in
            *[!A-Za-z0-9._/-]*) echo "invalid ref: $HEAD_REF"; exit 1 ;;
          esac
          git checkout -B "$HEAD_REF"

      - name: Run better-semantic-release action against this repo (read-only, no side effects)
        id: bsr
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: "true"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"
          build: "false"

      - name: Assert action produced outputs (proves composite output wiring + forked source ran)
        env:
          BSR_RELEASED: ${{ steps.bsr.outputs.released }}
          BSR_VERSION: ${{ steps.bsr.outputs.version }}
        run: |
          echo "released=$BSR_RELEASED"
          echo "version=$BSR_VERSION"
          test -n "$BSR_VERSION"
          test -n "$BSR_RELEASED"

      - name: Build-path smoke (force a version + run build_command; no git persistence)
        # Exercises the action's venv + build_command (python -m pip / python -m build).
        # `force: patch` makes a non-noop version so build actually runs; commit/tag/push
        # are off so nothing is released. Catches the pip-missing/venv-shadow class of
        # regression that a `build: false` smoke cannot.
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: "patch"
          build: "true"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"

  # The one job this repo forfeited by keeping its own ci.yml out of the shared
  # template's reach (see .repo-bootstrap.toml). Ported by hand rather than by
  # taking the template wholesale, which would have dropped the three jobs above.
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
        # Advisory, not a gate: the action fails the step on any pre-existing
        # moderate advisory in a dependency the PR merely touches, which blocks
        # unrelated work on a finding the PR did not introduce. The PR comment is
        # the deliverable here.
        continue-on-error: true

  codeql:
    name: CodeQL analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:python"

  # ============================================================================
  # Bot PR Governance (merged from bot-governance.yml; runs on PR opened only)
  # ============================================================================
  governance:
    name: Bot PR Rate Limit & Duplicate Check
    # Only govern pull requests whose branch lives in this repository.
    #
    # Technically: a pull_request run from a fork gets a read-only GITHUB_TOKEN
    # whatever the permissions block above asks for, and `gh pr close` and
    # `gh pr comment` are both unguarded under `set -e`, so the job would fail.
    #
    # More importantly: what it would be trying to do there is close an
    # outsider's pull request because somebody else's bot spent the day's rate
    # limit. Every bot this governs pushes its branch into this repository, so
    # nothing is lost by not running.
    #
    # Comparing head.repo.full_name against the repository asks whether the
    # branch lives here. head.repo.fork answers a different question — whether
    # the source repository is itself a fork — which would silently disable
    # governance for internal branches if this repository ever became one.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'opened'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Detect and govern bot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          # Detect if this is a bot-created PR by branch name pattern.
          # Two signals:
          #   1. Explicit bot-tool prefixes (Bolt, Palette, Jules, fix/web-scraper)
          #   2. Any branch ending with a long numeric task/trace ID (-[0-9]{14,})
          IS_BOT_PR=false
          if echo "$BRANCH" | grep -qE \
              '^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])'; then
            IS_BOT_PR=true
          elif echo "$BRANCH" | grep -qE -- \
              '-[0-9]{14,}$'; then
            IS_BOT_PR=true
          fi

          if [ "$IS_BOT_PR" = "false" ]; then
            echo "Not a bot PR ($BRANCH), skipping governance checks."
            exit 0
          fi

          echo "Bot PR detected on branch: $BRANCH"
          gh pr edit "$PR_NUMBER" --add-label "bot-generated" --repo "$REPO" || true

          # --- Rate limit: max 5 bot PRs/actor/day ---
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                  date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh pr list --repo "$REPO" --state open \
                   --json createdAt,headRefName,author \
                   --jq "[.[] |
                          select(.author.login == \"$ACTOR\") |
                          select(.createdAt > \"$SINCE\") |
                          select(.headRefName | test(
                            \"^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])\" +
                            \"|-[0-9]{14,}$\"
                          ))] | length" 2>/dev/null || echo 0)

          echo "Bot PRs by $ACTOR in last 24h: $COUNT"

          if [ "${COUNT:-0}" -gt 5 ]; then
            gh pr close "$PR_NUMBER" --repo "$REPO" \
              --comment "**Bot rate limit exceeded**: $COUNT PRs created in the last 24 hours (limit: 5/day). This PR has been automatically closed to reduce PR backlog and CI resource waste. Please consolidate related fixes."
            echo "PR #$PR_NUMBER closed: rate limit exceeded ($COUNT/5 today)"
            exit 0
          fi

          # --- Duplicate detection by title keyword ---
          KEYWORD=$(echo "$PR_TITLE" | sed 's/[^a-zA-Z0-9 _-]//g' | \
                    tr '[:upper:]' '[:lower:]' | cut -c1-50 | xargs)
          if [ -z "$KEYWORD" ]; then
            echo "No keyword extracted, skipping duplicate check."
            exit 0
          fi

          DUPES=$(gh pr list --repo "$REPO" --state open --search "$KEYWORD" \
                   --json number \
                   --jq "[.[] | select(.number != $PR_NUMBER)] | length" \
                   2>/dev/null || echo 0)

          echo "Similar open PRs for '$KEYWORD': $DUPES"
          if [ "${DUPES:-0}" -ge 1 ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" \
              --add-label "possible-duplicate" || true
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "**Possible duplicate**: found ${DUPES} open PR(s) with similar title ('${KEYWORD}'). Check before merging: \`gh pr list --search '${KEYWORD}' --state open\`"
          fi
