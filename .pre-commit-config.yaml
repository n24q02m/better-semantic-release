---
default_language_version:
  python: python3

# Files the fixers must not rewrite, for two different reasons:
#   CHANGELOG.rst is generated. (This fork's docs toolchain is reStructuredText;
#   the pattern used to name CHANGELOG.md, which does not exist here, so nothing
#   was actually excluded.)
#   scripts/repo-bootstrap/ is vendored byte-for-byte from a canonical copy that
#   lives outside this repo. A fixer touching it there would put the two copies
#   silently out of step, and the next vendoring pass would undo the fix anyway.
exclude: "^(CHANGELOG\\.rst|scripts/repo-bootstrap/.*)$"

repos:
  # Meta hooks
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  # Security & credential scanning/alerting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: debug-statements
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: check-builtin-literals
      - id: check-yaml
      - id: check-toml
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-ast

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.16.0
    hooks:
      - id: pyupgrade
        args: ["--py38-plus", "--keep-runtime-typing"]

  # Linters and validation
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.1
    hooks:
      - id: ruff
        name: ruff (lint)
        args:
          - "--fix"
          - "--exit-non-zero-on-fix"
          - "--statistics"
          - "--output-format=full"
      - id: ruff-format
        name: ruff (format)

  # mypy runs from the project's own environment rather than pre-commit's
  # isolated one. The isolated environment cannot see click, rich or GitPython,
  # so it would report import errors that ci.yml never sees -- a hook that
  # disagrees with CI is worse than no hook. Targets come from [tool.mypy] files
  # in pyproject.toml, which is why this passes no arguments.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        files: "^(src|tests)/.*"
        pass_filenames: false

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      # - id: python-use-type-annotations
      - id: python-check-blanket-noqa
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/jendrikseipp/vulture
    rev: "v2.11"
    hooks:
      # Scoped to the product code, and to a fixed path rather than to whatever
      # is staged. This fork uses a src layout, so the bare "semantic_release"
      # this hook used to name resolved to nothing and it failed on every Python
      # commit. `tests/` is deliberately excluded: pytest hook signatures,
      # Protocol.__call__ parameters and base-class overrides are full of names
      # that are unused locally but load-bearing, which is the same reason ruff
      # ignores ARG001/ARG002 for tests in pyproject.toml.
      - id: vulture
        pass_filenames: false
        args:
          - --min-confidence
          - "100"
          - --sort-by-size
          - "src/semantic_release"

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args:
          - "-c"
          - "pyproject.toml"
          - "--quiet"
          - "src/"
        # Needed if using pyproject.toml for config
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false

  # The sdist and wheel carry README.rst to PyPI, so a pyproject that names a
  # file which is not on disk publishes an empty project page -- and a PyPI
  # version can only be yanked, never re-uploaded. Runs through uv for the same
  # reason mypy does: it uses the project interpreter rather than whichever
  # `python` happens to be on PATH, which differs between here and CI.
  - repo: local
    hooks:
      - id: verify-readme-sync
        name: Verify README registry metadata
        entry: uv run --no-sync python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.
        language: system
        pass_filenames: false

  # GHA linting
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.30.0"
    hooks:
      - id: check-github-workflows
      - id: check-readthedocs
      # Dependency updates here are driven by renovate.json; there is no
      # dependabot config for check-dependabot to ever apply to.
      - id: check-renovate
